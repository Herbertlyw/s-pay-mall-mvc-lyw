<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机械键盘 · 演示商城</title>
  <style>
    :root { color-scheme: light; font: 17px/1.6 system-ui,sans-serif; color: #222b2a; background: #eff2ed; }
    body { margin: 0; }
    main { width: min(56rem, 90%); margin: 7vh auto; display: grid; grid-template-columns: 1.2fr 1fr;
      border: 1px solid #cbd3ca; border-radius: 12px; overflow: hidden; background: #fff; }
    img { width: 100%; height: 100%; object-fit: contain; background: #f4f5f1; }
    section { padding: clamp(1.5rem, 4vw, 3rem); }
    h1 { margin: 0; font-size: 2.1rem; } .price { color: #17634e; font-size: 1.6rem; margin: .3rem 0; }
    button { padding: .65rem 1rem; background: #205c4c; color: white; border: 0; border-radius: 5px; font: inherit; cursor: pointer; }
    button.secondary { color: #243d36; background: #edf1ee; } button:disabled { opacity: .5; }
    #status { overflow-wrap: anywhere; } small { color: #51635d; }
    @media (max-width: 650px) { main { grid-template-columns: 1fr; } img { max-height: 17rem; } }
  </style>
  <script src="shop.js" defer></script>
</head>
<body><main>
  <img src="images/sku-keyboard-001.png" alt="演示商品机械键盘">
  <section><h1 id="name">机械键盘</h1><p id="price" class="price"></p>
    <p>在本机体验下单、付款和取消。所有操作均为模拟交易。</p>
    <button id="create" disabled>创建订单</button>
    <button id="pay" hidden>模拟付款</button>
    <button id="cancel" class="secondary" hidden>取消订单</button>
    <p id="status" role="status" aria-live="polite"></p>
    <small id="number"></small>
  </section>
</main></body></html>
